name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres service so the tenancy / GDPR / jobs / ark integration suites RUN in CI — without a
    # TEST_DATABASE_URL they SKIP, which is exactly the security-critical coverage we were missing.
    # Passwordless (trust auth) to match the local-stand convention (postgres@… , no password);
    # localhost → no TLS (PGSSL=disable).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pulse
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # TEST_DATABASE_URL flips the integration suites on. DATABASE_URL is deliberately left UNSET
      # at the job level so the DB-less unit tests keep their DB-less path (they opt in per-file).
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/pulse
      PGSSL: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build shared narrative engine
        run: |
          npm ci --prefix frontend
          npm run build:shared --prefix frontend
      # Apply migrations BEFORE the suite: the integration tests expect the schema present
      # (they INSERT into users/workspaces/channels/jobs — they do not self-migrate).
      - name: Migrate CI database
        run: node server/migrate.js
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/pulse
      - run: npm run check
      - run: python -m py_compile mtproto/service.py collector/pulse_collector.py
      # Версия пиннится: новый релиз ruff с новыми правилами не должен внезапно красить CI.
      - name: Lint Python (ruff)
        run: |
          pip install ruff==0.16.0
          ruff check mtproto collector test
      # Пин по той же причине, что и ruff. Настройки — в mypy.ini в корне (py312, минимальный
      # не-strict набор: сервис осознанно динамический, Telethon/FastAPI duck-typing).
      - name: Type-check Python (mypy)
        run: |
          pip install mypy==2.3.0
          mypy mtproto collector --ignore-missing-imports
      - run: python -m unittest discover -s test -p "test_*.py"
      - name: Parse inline browser scripts
        run: |
          node - <<'NODE'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
          let match;
          while ((match = re.exec(html))) new vm.Script(match[1]);
          NODE

  # Аудит известных CVE в зависимостях. Гейтим только production-поверхность (--omit=dev) на
  # high+: dev-тулинг (vite/biome/playwright) обновляет Dependabot, а падение CI на каждом
  # low-advisory в сборочной цепочке давало бы постоянный шум вместо сигнала. Python: pip-audit
  # резолвит requirements целиком, так что транзитивные CVE тоже видны.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Audit npm dependencies (server)
        run: npm audit --omit=dev --audit-level=high
      # GHSA-qwww-vcr4-c8h2 (react-router: CSRF в RSC-режиме) приложение не затрагивает: RSC/server-
      # режим react-router не используется (клиентский BrowserRouter поверх Express-статики, RSC-API
      # в коде нет), а фикс существует только в мажоре v8. audit-ci даёт точечный allowlist поверх
      # той же npm-audit базы — новые advisories по-прежнему валят джоб. Снять allowlist при бампе
      # react-router-dom на исправленную версию (Dependabot предложит).
      - name: Audit npm dependencies (frontend)
        run: npx -y audit-ci@^7 --high --skip-dev --allowlist GHSA-qwww-vcr4-c8h2
        working-directory: frontend
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit Python dependencies (mtproto + collector)
        run: |
          pip install pip-audit
          pip-audit -r mtproto/requirements.txt
          pip-audit -r collector/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Design-token canon (motion ladder, type scale, layering). Static and ~instant, so it runs
      # before the suite: a re-typed duration should fail in seconds, not after the e2e leg.
      - run: npm run lint:motion
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke and campaign journey
        run: npm run test:e2e:smoke
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-smoke-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
