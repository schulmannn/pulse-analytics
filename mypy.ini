# Минимальный type-check Python-контура (mtproto, collector); CI зовёт его после ruff:
#   mypy mtproto collector --ignore-missing-imports
# Не strict: сервис осознанно динамический (Telethon/FastAPI duck-typing), поэтому только
# дефолтные проверки mypy. Сторонние пакеты без стабов (telethon, qrcode) не типизируем —
# ignore_missing_imports; py312 — рантайм прода (Dockerfile.*) и CI (setup-python).
[mypy]
python_version = 3.12
ignore_missing_imports = True
